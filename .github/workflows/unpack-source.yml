name: Hey Frame tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -q
          bash -n install.sh
          bash -n uninstall.sh
          bash -n steamflow-bootstrap.sh
