name: Publish Hey Frame v0.6.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.6.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Validate release source
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -q
          bash -n install.sh
          bash -n uninstall.sh
          bash -n steamflow-bootstrap.sh
          grep -F "VERSION = '0.6.3'" src/assistant.py
      - name: Publish release (create tag if missing)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'v0.6.3';
            try {
              const existing = await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.info('Release already exists: ' + existing.data.html_url);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const body = [
              '## Hey Frame v0.6.3 — Voice activation and dashboard fixes',
              '',
              'This release focuses on making the Steam Frame voice assistant more reliable and easier to turn off.',
              '',
              '### Changes',
              '- Raised wake-phrase confirmation from two matches to five consecutive non-silent recognition matches, reducing false activations.',
              '- Restored a dedicated LISTEN ON/OFF control on the SteamVR dashboard.',
              '- Added an always-available emergency stop when listening is active, even while other dashboard operations are busy.',
              '- STOP now directly disables the user service and its automatic startup, with status verification.',
              '- Retains the v0.6.2 short-command recognition improvements, GLaDOS/normal voice mode, Portal quotes and SFRecorder controls.',
              '',
              '### Install / update (on the headset)',
              '```bash',
              'curl -fsSL https://raw.githubusercontent.com/SteamFlowYT/HeyFrame/main/steamflow-bootstrap.sh | bash',
              '```',
              '',
              'If listening keeps activating unexpectedly, disable it first:',
              '```bash',
              'systemctl --user disable --now hey-frame.service',
              '```',
              '',
              '### Notes',
              '- Experimental: speech detection and the SteamVR dashboard still need physical headset validation.',
              '- The installer preserves the previous listening preference.',
              '- This release does not install hardware-button grabs or volume changes.',
            ].join('\n');
            const release = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: 'Hey Frame v0.6.3',
              body, draft: false, prerelease: true, generate_release_notes: false
            });
            core.info('Published: ' + release.data.html_url);
